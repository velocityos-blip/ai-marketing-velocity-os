name: vos
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://vos:${VOS_DB_PASSWORD:?run bootstrap.sh}@mongo:27017/vos?authSource=vos
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?run bootstrap.sh}
    volumes:
      - campaigns:/var/lib/vos
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 5
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run bootstrap.sh}
      VOS_DB_PASSWORD: ${VOS_DB_PASSWORD:?run bootstrap.sh}
    volumes:
      - accounts:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok || quit(1)"]
      interval: 15s
      timeout: 10s
      retries: 10
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VOS_API_HOST: ${VOS_API_HOST:?set the backend hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  accounts:
  campaigns:
  certificates:
  caddy_config:
